services:
  - type: web
    name: donorx
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
